# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

worker_processes auto;
error_log /logs/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '"remote_user": "$http_oci_splat_x_auth_uid", '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /logs/nginx/access.log  main;

    proxy_temp_path /run/nginx 1 2;
    fastcgi_temp_path /run/nginx 1 2;
    uwsgi_temp_path /run/nginx 1 2;
    scgi_temp_path /run/nginx 1 2;
    client_body_temp_path /run/nginx 1 2;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

# server {
#     listen       8083;
#     server_name  _;
#     root         /usr/share/nginx/html;

#     location /nginx_status {
#         stub_status on;
#         allow 127.0.0.1;
#         deny all;
#     }
# }

server {
        listen 8443 ssl http2;
        listen [::]:8443 ssl http2;

        # Enable HSTS header with 6 month validity
        add_header Strict-Transport-Security "max-age=15768000;";

        ssl_protocols TLSv1.2 TLSv1.3;

        # Server cert/key
        ssl_certificate /etc/certs/pki/lvv_ui_tls_server_cert.pem;
        ssl_certificate_key /etc/certs/pki/lvv_ui_tls_server_key.pem;

        # Client SSL verification
        # Notice that the /etc/oci-pki dir needs to be mounted from the host.
        # This bundle contains the region-internal CAs

        ssl_client_certificate /etc/oci-pki/ca-bundle.pem;
        ssl_verify_client on;

        # Validate the client's name. This is a SPLAT requirement.
#         if ($ssl_client_s_dn_cn != "splat-api-client.us-ashburn-1.oci.oracleiaas.com") {
#             return 403;
#         }


        server_name _;
        root         /usr/share/nginx/html;

        gzip            on;
        gzip_types      application/json text/css application/javascript;
        gzip_min_length 1024;
        gzip_vary       on;
        gzip_proxied    any;

        location /libs {
           expires 1h;
           add_header Cache-Control "no-store";
           proxy_set_header X-Real-IP $remote_addr;
        }

        location /landing {
           expires 1h;
           add_header Cache-Control "no-store";
           proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
          add_header Set-Cookie "X-Oracle-Vendor=$http_oci_splat_x_auth_uid; Max-Age=60";
          add_header Set-Cookie "X-Oracle-Vendor-Email=$http_oci_splat_x_auth_email; Max-Age=60";
          add_header Cache-Control "no-store";
          try_files /index.html /40x.html;
        }
    }
}
