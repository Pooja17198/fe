        format: date-time
        description: Time when the task was created, in RFC3339 format.
      timeUpdated:
        type: string
        format: date-time
        description: Time when the task was last updated, in RFC3339 format.
      timeStarted:
        type: string
        format: date-time
        description: Time when the task was started, in RFC3339 format.
      timeCompleted:
        type: string
        format: date-time
        description: Time when the task was completed, in RFC3339 format.

  QcTaskCollection:
    type: object
    description: Results of listing QC checklist tasks for a work order.
    required:
      - items
    properties:
      items:
        type: array
        description: List of QC task summaries.
        items:
          $ref: '#/definitions/QcTaskSummary'

  QcTaskCommentSummary:
    type: object
    description: Summary view of a QC task comment.
    required:
      - commentId
      - taskId
      - comment
      - timeCreated
    properties:
      commentId:
        type: string
        description: Identifier of the comment.
      taskId:
        type: string
        description: Identifier of the parent task.
      createdBy:
        type: string
        description: Name of the user who created the comment.
      comment:
        type: string
        description: Comment text.
      timeCreated:
        type: string
        format: date-time
        description: Time when the comment was created, in RFC3339 format.

  CreateQcTaskCommentDetails:
    type: object
    description: Details used to add a comment to a QC checklist task.
    required:
      - comment
      - createdBy
      - timeCreated
    properties:
      comment:
        type: string
        description: Comment text.
      createdBy:
        type: string
        description: Identifier of the user creating the comment.
      emailAddress:
        type: string
        description: Email address of the user creating the comment.
      timeCreated:
        type: string
        format: date-time
        description: Creation timestamp in RFC3339 format.

  CreateQcTaskAttachmentDetails:
    type: object
    description: Details used to add an attachment reference to a QC checklist task.
    required:
      - fileName
      - contentType
      - content
      - contentSize
      - createdBy
      - timeCreated
    properties:
      fileName:
        type: string
        description: Name of the attachment file.
      contentType:
        type: string
        description: MIME type of the attachment file.
      contentSize:
        type: integer
        format: int64
        description: Size of the attachment in bytes.
      createdBy:
        type: string
        description: Identifier of the user creating the attachment.
      emailAddress:
        type: string
        description: Email address of the user creating the attachment.
      timeCreated:
        type: string
        format: date-time
        description: Creation timestamp in RFC3339 format.
      content:
        type: string
        format: byte
        description: Base64-encoded binary content of the attached file.
      notes:
        type: string
        description: Optional notes about the attachment.

  QcTaskCommentCollection:
    type: object
    description: Results of listing QC task comments.
    required:
      - items
    properties:
      items:
        type: array
        description: List of QC task comments.
        items:
          $ref: '#/definitions/QcTaskCommentSummary'

  QcTaskAttachmentSummary:
    type: object
    description: Summary view of a QC task attachment.
    required:
      - attachmentId
      - taskId
      - fileName
      - contentType
      - timeCreated
    properties:
      attachmentId:
        type: string
        description: Identifier of the attachment.
      taskId:
        type: string
        description: Identifier of the parent task.
      createdBy:
        type: string
        description: Name of the user who created the attachment.
      fileName:
        type: string
        description: Name of the attached file.
      contentType:
        type: string
        description: MIME type of the attached file.
      contentSize:
        type: integer
        format: int64
        description: Size of the attached file in bytes.
      content:
        type: string
        description: Base64-encoded binary content of the attached file.
      timeCreated:
        type: string
        format: date-time
        description: Time when the attachment was created, in RFC3339 format.

  QcTaskAttachmentCollection:
    type: object
    description: Results of listing QC task attachments.
    required:
      - items
    properties:
      items:
        type: array
        description: List of QC task attachments.
        items:
          $ref: '#/definitions/QcTaskAttachmentSummary'

  RoomPlatform:
    type: object
    description: Platform details for a rack in a room
    properties:
      rackNumber:
        type: string
        description: Rack number
      platformName:
        type: string
        description: Platform name
      blockName:
        type: string
        description: block name

#==========[ Parameters ]================================================================================================
parameters:
  RoomNameQueryParam:
    in: query
    name: roomName
    description: Room name for filtering
    required: false
    type: string
  BlockNameQueryParam:
    in: query
    name: blockName
    required: false
    type: string
    description: Block name for filtering physical connections.
  BomIdQueryParam:
    in: query
    name: bomId
    description: BOM ID for filtering
    required: false
    type: integer
    format: int32

  PaginationLimitQueryParam:
    in: query
    name: limit
    description: Max items per page
    required: false
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 10

  PaginationTokenQueryParam:
    in: query
    name: page
    description: Pagination token
    required: false
    type: string

  SortOrderQueryParam:
    in: query
    name: sortOrder
    description: Sort order
    required: false
    type: string
    enum:
      - ASC
      - DESC
    default: ASC

  SortByQueryParam:
    in: query
    name: sortBy
    description: Sort field
    required: false
    type: string
    enum:
      - id
      - name
    default: id

  RequestIdHeader:
    in: header
    name: opc-request-id
    description: Request ID for idempotency
    required: false
    type: string



  SourceRackNumberQueryParam:
    in: query
    name: sourceRackNumber
    required: true
    type: string
    description: Source rack number

  DestinationRackNumberQueryParam:
    in: query
    name: destinationRackNumber
    required: true
    type: string
    description: Destination rack number

  PhyCutBuildingNameQueryParam:
    in: query
    name: buildingName
    description: Building name for filtering
    required: false
    type: string

  PhyCutRoomNameQueryParam:
    in: query
    name: roomName
    description: Room name for filtering
    required: false
    type: string

  PhyCutRoomNameRequiredQueryParam:
    in: query
    name: roomName
    description: Room name for filtering
    required: true
    type: string

  PhyCutRackNumberQueryParam:
    in: query
    name: rackNumber
    description: Rack number for filtering
    required: false
    type: string

  PhyCutRackRoleQueryParam:
    in: query
    name: rackRole
    description: Rack role for filtering
    required: false
    type: string
    enum:
      - SOURCE
      - DESTINATION

  PhyCutRackTypeQueryParam:
    in: query
    name: rackType
    description: Rack type for filtering. Currently only gpu is supported.
    required: false
    type: string
    enum:
      - GPU

  PhyCutDeviceNameQueryParam:
    in: query
    name: deviceName
    description: Device name for filtering
    required: false
    type: string

  PhyCutDevicePortQueryParam:
    in: query
    name: devicePort
    description: Device port for filtering
    required: false
    type: string

  PhysicalCutsheetSortByQueryParam:
    in: query
    name: sortBy
    description: Sort field
    required: false
    type: string
    enum:
      - buildingName
      - rackNumber
      - deviceName
      - devicePort
    default: rackNumber

  RackViewRoomNameQueryParam:
    in: query
    name: roomName
    description: Room name for filtering
    required: false
    type: string
  RackViewRackNumberQueryParam:
    in: query
    name: rackNumber
    description: Rack number for filtering
    required: false
    type: string
  QcLifecycleStatusQueryParam:
    in: query
    name: lifecycleState
    description: |
      Optional exact-match filter for the QC work order lifecycle state.

      Use this when the UI needs to show only one work order state:
      IN_PROGRESS, FAILED, or SUCCEEDED.
      ide-lvv translates this value internally to the downstream Taskflow lifecycle state.
    required: false
    type: string
    enum:
      - IN_PROGRESS
      - FAILED
      - SUCCEEDED

  QcCreatedByQueryParam:
    in: query
    name: createdBy
    description: |
      Optional exact-match filter for the user who created the QC work order.
      Use this to narrow the list to work orders created by a specific operator or service account.
    required: false
    type: string

  QcRegionIdQueryParam:
    in: query
    name: regionId
    description: |
      Optional exact-match filter for the region scope of the QC work order.
      This is applied together with the other filters using AND logic.
    required: false
    type: string

  QcBuildingIdQueryParam:
    in: query
    name: buildingId
    description: |
      Optional exact-match filter for the building scope of the QC work order.
      This is applied together with the other filters using AND logic.
    required: false
    type: string

  QcRoomIdQueryParam:
    in: query
    name: roomId
    description: |
      Optional exact-match filter for the room scope of the QC work order.
      This is applied together with the other filters using AND logic.
    required: false
    type: string

  QcRackLocationIdQueryParam:
    in: query
    name: rackLocationId
    description: |
      Optional exact-match filter for the rack location scope of the QC work order.
      This is applied together with the other filters using AND logic.
    required: false
    type: string

  QcSortByQueryParam:
    in: query
    name: sortBy
    description: |
      Sort key for QC work order list results.

      - timeCreated sorts by creation time.

      Pair this with sortOrder=DESC to get newest-first ordering, which is the default UI behavior.
    required: false
    type: string
    enum:
      - timeCreated

  QcWorkOrderIdPathParam:
    in: path
    name: workOrderId
    description: Identifier of the QC work order.
    required: true
    type: string

  QcTaskSortByQueryParam:
    in: query
    name: sortBy
    description: |
      Sort key for QC task list results for a work order.

      - timeStarted sorts by task start time.
    required: false
    type: string
    enum:
      - timeStarted

  QcTaskIdPathParam:
    in: path
    name: taskId
    description: Identifier of the QC checklist task.
    required: true
    type: string

  QcTaskCommentSortByQueryParam:
    in: query
    name: sortBy
    description: |
      Sort key for QC task comments.

      - timeCreated sorts by creation time.
      - userName sorts by the comment author's user name.
      - emailAddress sorts by the comment author's email address.
    required: false
    type: string
    enum:
      - timeCreated
      - userName
      - emailAddress

  QcTaskAttachmentSortByQueryParam:
    in: query
    name: sortBy
    description: |
      Sort key for QC task attachments.

      - attachmentId sorts by attachment identifier.
      - fileName sorts by file name.
      - contentType sorts by content type.
      - contentSize sorts by content size.
    required: false
    type: string
    enum:
      - attachmentId
      - fileName
      - contentType
      - contentSize

#==========[ Responses ]================================================================================================
responses:
# This is being included in the 'responses:' section.
# For that reason, it is important that responses are indented exactly two spaces.
# To maintain consistency across services, do not change the descriptions.
  400:
    description: Bad Request
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  401:
    description: Unauthorized
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  404:
    description: Not Found
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  405:
    description: Method Not Allowed
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  409:
    description: Conflict
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  412:
    description: Precondition Failed
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  429:
    description: Too Many Requests
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  500:
    description: Internal Server Error
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  default:
    description: Unknown Error
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
