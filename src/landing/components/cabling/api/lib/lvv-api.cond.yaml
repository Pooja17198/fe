  /qc/workorders:
    get:
      tags: ['Qc']
      operationId: listQcWorkOrders
      summary: List QC work orders
      description: |
        Returns a list of QC work orders.
        
        All filters are exact-match filters unless otherwise stated.
        When multiple filters are provided, we apply them together using AND logic.
        The lifecycleState filter is UI-facing and is mapped internally to the Taskflow
        work order lifecycle state before the downstream call is made.
      parameters:
        - $ref: '#/parameters/QcLifecycleStatusQueryParam'
        - $ref: '#/parameters/QcCreatedByQueryParam'
        - $ref: '#/parameters/QcRegionIdQueryParam'
        - $ref: '#/parameters/QcBuildingIdQueryParam'
        - $ref: '#/parameters/QcRoomIdQueryParam'
        - $ref: '#/parameters/QcRackLocationIdQueryParam'
        - $ref: '#/parameters/PaginationLimitQueryParam'
        - $ref: '#/parameters/PaginationTokenQueryParam'
        - $ref: '#/parameters/SortOrderQueryParam'
        - $ref: '#/parameters/QcSortByQueryParam'
        - $ref: '#/parameters/RequestIdHeader'
      produces:
        - application/json
      responses:
        200:
          description: List of QC work orders.
          schema:
            $ref: '#/definitions/QcWorkOrderCollection'
          headers:
            opc-request-id:
              type: string
              description: The unique Oracle-assigned identifier for the request.
            opc-next-page:
              type: string
              description: For pagination of a list of items.
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
    post:
      tags: ['Qc']
      operationId: createQcWorkOrder
      summary: Create QC work order
      description: Initiates a QC run by creating a new QC work order.
      parameters:
        - in: body
          name: createQcWorkOrderDetails
          description: Details for creating a QC work order.
          required: true
          schema:
            $ref: '#/definitions/CreateQcWorkOrderDetails'
        - $ref: '#/parameters/RequestIdHeader'
      consumes:
        - application/json
      produces:
        - application/json
      responses:
        201:
          description: QC work order created.
          schema:
            $ref: '#/definitions/QcWorkOrder'
          headers:
            opc-request-id:
              type: string
              description: The unique Oracle-assigned identifier for the request.
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
