        type: array
        items:
          type: string
#==========[ Parameters ]================================================================================================
parameters:
  RoomNameQueryParam:
    in: query
    name: roomName
    description: Room name for filtering
    required: false
    type: string
  BlockNameQueryParam:
    in: query
    name: blockName
    required: false
    type: string
    description: Block name for filtering physical connections.
  BomIdQueryParam:
    in: query
    name: bomId
    description: BOM ID for filtering
    required: false
    type: integer
    format: int32

  PaginationLimitQueryParam:
    in: query
    name: limit
    description: Max items per page
    required: false
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 10

  PaginationTokenQueryParam:
    in: query
    name: page
    description: Pagination token
    required: false
    type: string

  SortOrderQueryParam:
    in: query
    name: sortOrder
    description: Sort order
    required: false
    type: string
    enum:
      - ASC
      - DESC
    default: ASC

  SortByQueryParam:
    in: query
    name: sortBy
    description: Sort field
    required: false
    type: string
    enum:
      - id
      - name
    default: id

  RequestIdHeader:
    in: header
    name: opc-request-id
    description: Request ID for idempotency
    required: false
    type: string
  RoomNameQueryParam:
    in: query
    name: roomName
    required: true
    type: string
    description: Room name for filtering

  SourceRackNumberQueryParam:
    in: query
    name: sourceRackNumber
    required: true
    type: string
    description: Source rack number

  DestinationRackNumberQueryParam:
    in: query
    name: destinationRackNumber
    required: true
    type: string
    description: Destination rack number

  PhyCutBuildingNameQueryParam:
    in: query
    name: buildingName
    description: Building name for filtering
    required: false
    type: string

  PhyCutRoomNameQueryParam:
    in: query
    name: roomName
    description: Room name for filtering
    required: false
    type: string

  PhyCutRoomNameRequiredQueryParam:
    in: query
    name: roomName
    description: Room name for filtering
    required: true
    type: string

  PhyCutRackNumberQueryParam:
    in: query
    name: rackNumber
    description: Rack number for filtering
    required: false
    type: string

  PhyCutRackRoleQueryParam:
    in: query
    name: rackRole
    description: Rack role for filtering
    required: false
    type: string
    enum:
      - SOURCE
      - DESTINATION

  PhyCutRackTypeQueryParam:
    in: query
    name: rackType
    description: Rack type for filtering. Currently only gpu is supported.
    required: false
    type: string
    enum:
      - GPU

  PhyCutDeviceNameQueryParam:
    in: query
    name: deviceName
    description: Device name for filtering
    required: false
    type: string

  PhyCutDevicePortQueryParam:
    in: query
    name: devicePort
    description: Device port for filtering
    required: false
    type: string

  PhysicalCutsheetSortByQueryParam:
    in: query
    name: sortBy
    description: Sort field
    required: false
    type: string
    enum:
      - buildingName
      - rackNumber
      - deviceName
      - devicePort
    default: rackNumber

  RackViewRoomNameQueryParam:
    in: query
    name: roomName
    description: Room name for filtering
    required: false
    type: string
  RackViewRackNumberQueryParam:
    in: query
    name: rackNumber
    description: Rack number for filtering
    required: false
    type: string
#==========[ Responses ]================================================================================================
responses:
# This is being included in the 'responses:' section.
# For that reason, it is important that responses are indented exactly two spaces.
# To maintain consistency across services, do not change the descriptions.
  400:
    description: Bad Request
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  401:
    description: Unauthorized
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  404:
    description: Not Found
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  405:
    description: Method Not Allowed
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  409:
    description: Conflict
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  412:
    description: Precondition Failed
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  429:
    description: Too Many Requests
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  500:
    description: Internal Server Error
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'
  default:
    description: Unknown Error
    headers:
      opc-request-id: *ref-opc-request-id
    schema:
      $ref: '#/definitions/Error'